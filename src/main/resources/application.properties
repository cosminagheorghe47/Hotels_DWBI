spring.application.name=Hotels_DWBI

# ===============================
# DATABASE CONNECTION
# ===============================

# OLTP
spring.datasource.oltp.jdbc-url=jdbc:mysql://localhost:3306/hotel_oltp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.oltp.username=hotel_app
spring.datasource.oltp.password=hotel123
spring.datasource.oltp.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.oltp.hikari.maximum-pool-size=10

# DW
spring.datasource.dw.jdbc-url=jdbc:mysql://localhost:3306/hotel_dw?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.dw.username=hotel_app
spring.datasource.dw.password=hotel123
spring.datasource.dw.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.dw.hikari.maximum-pool-size=10

# JPA/Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect




# ===============================
# SERVER
# ===============================
server.port=8080

# ===============================
# LOGGING (optional, but nice)
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
